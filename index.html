<!DOCTYPE html>
<html lang="uk">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Магазини автозапчастин</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Arial, sans-serif;
      background-color: #f4f6f9;
      color: #222;
      padding: 24px 16px;
      line-height: 1.5;
    }

    .container {
      max-width: 1080px;
      margin: 0 auto;
      background-color: #ffffff;
      border: 1px solid #dce1e7;
      border-radius: 8px;
      padding: 24px;
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.05);
    }

    .header-bar {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 6px;
    }

    h1 {
      font-size: 22px;
      color: #1a2533;
    }

    .hint-text {
      font-size: 13px;
      color: #5c6877;
      margin-bottom: 16px;
    }

    .top-controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      border-bottom: 2px solid #e2e7ee;
      padding-bottom: 12px;
      margin-bottom: 20px;
    }

    .tabs-nav {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }

    .tab-btn {
      padding: 9px 18px;
      font-size: 14px;
      font-weight: 600;
      color: #3b4859;
      background-color: #eef1f6;
      border: 1px solid #d0d7e2;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .tab-btn:hover {
      background-color: #e1e7f0;
    }

    .tab-btn.active {
      background-color: #1d5bbf;
      color: #ffffff;
      border-color: #1d5bbf;
    }

    .add-btn {
      padding: 9px 18px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      background-color: #1f7a3f;
      border: 1px solid #1f7a3f;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s ease;
    }

    .add-btn:hover {
      background-color: #186332;
    }

    .tab-panel {
      display: none;
    }

    .tab-panel.active {
      display: block;
    }

    .table-wrapper {
      width: 100%;
      overflow-x: auto;
    }

    table {
      width: 100%;
      border-collapse: collapse;
      font-size: 14px;
    }

    th, td {
      padding: 10px 14px;
      text-align: left;
      border: 1px solid #dde2e9;
      vertical-align: middle;
    }

    th {
      background-color: #f0f4f8;
      color: #1a2533;
      font-weight: 600;
      white-space: nowrap;
    }

    th.action-col,
    td.action-cell {
      width: 56px;
      text-align: center;
      white-space: nowrap;
    }

    tbody tr:nth-child(even) {
      background-color: #fafbfc;
    }

    tbody tr:hover {
      background-color: #eef4fc;
    }

    td.editable-cell {
      cursor: pointer;
      position: relative;
      transition: background-color 0.12s ease;
    }

    td.editable-cell:hover {
      background-color: #e3edf9;
    }

    td.editable-cell.editing {
      padding: 6px 8px;
      background-color: #ffffff;
      cursor: default;
    }

    .inline-edit-wrapper {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    .inline-input {
      flex: 1;
      min-width: 110px;
      padding: 5px 8px;
      font-size: 14px;
      font-family: inherit;
      color: #1a2533;
      background-color: #ffffff;
      border: 1px solid #1d5bbf;
      border-radius: 4px;
      outline: none;
      box-shadow: 0 0 0 2px rgba(29, 91, 191, 0.15);
    }

    .inline-save-btn {
      padding: 5px 9px;
      font-size: 13px;
      font-weight: 600;
      color: #ffffff;
      background-color: #1d5bbf;
      border: 1px solid #1d5bbf;
      border-radius: 4px;
      cursor: pointer;
      line-height: 1.2;
      flex-shrink: 0;
    }

    .inline-save-btn:hover {
      background-color: #164694;
    }

    .delete-row-btn {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      width: 28px;
      height: 28px;
      font-size: 18px;
      font-weight: 700;
      line-height: 1;
      color: #c53030;
      background-color: #fff5f5;
      border: 1px solid #feb2b2;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.15s ease, color 0.15s ease, border-color 0.15s ease;
    }

    .delete-row-btn:hover {
      background-color: #e53e3e;
      color: #ffffff;
      border-color: #e53e3e;
    }

    .badge {
      display: inline-block;
      padding: 2px 9px;
      font-size: 12px;
      font-weight: 600;
      border-radius: 12px;
    }

    .badge-yes {
      background-color: #e3f5e8;
      color: #186a32;
    }

    .badge-no {
      background-color: #f2f4f7;
      color: #4a5568;
    }

    .price-cell {
      font-weight: 600;
      white-space: nowrap;
    }

    /* Стилі модальних вікон (попапів) */
    .modal-overlay {
      display: none;
      position: fixed;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      background-color: rgba(18, 26, 38, 0.55);
      align-items: center;
      justify-content: center;
      padding: 16px;
      z-index: 1000;
    }

    .modal-overlay.open {
      display: flex;
    }

    .modal-window {
      background-color: #ffffff;
      border-radius: 8px;
      width: 100%;
      max-width: 480px;
      border: 1px solid #dce1e7;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15);
      overflow: hidden;
    }

    .modal-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 16px 20px;
      background-color: #f0f4f8;
      border-bottom: 1px solid #dde2e9;
    }

    .modal-header.error-header {
      background-color: #fef2f2;
      border-bottom-color: #fecaca;
    }

    .modal-title {
      font-size: 17px;
      font-weight: 600;
      color: #1a2533;
    }

    .modal-header.error-header .modal-title {
      color: #991b1b;
    }

    .modal-close {
      background: none;
      border: none;
      font-size: 20px;
      line-height: 1;
      color: #5c6877;
      cursor: pointer;
      padding: 4px 8px;
      border-radius: 4px;
    }

    .modal-close:hover {
      background-color: #e2e7ee;
      color: #1a2533;
    }

    .modal-body {
      padding: 20px;
    }

    .error-modal-text {
      font-size: 14px;
      color: #2d3748;
      margin-bottom: 12px;
    }

    .error-details-list {
      margin: 10px 0 4px 18px;
      font-size: 13px;
      color: #7f1d1d;
      background-color: #fff5f5;
      border: 1px solid #fed7d7;
      border-radius: 6px;
      padding: 10px 14px 10px 28px;
    }

    .error-details-list li {
      margin-bottom: 4px;
    }

    .error-details-list li:last-child {
      margin-bottom: 0;
    }

    .form-group {
      margin-bottom: 14px;
    }

    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      color: #2d3748;
      margin-bottom: 5px;
    }

    .form-control {
      width: 100%;
      padding: 9px 12px;
      font-size: 14px;
      border: 1px solid #cbd5e0;
      border-radius: 6px;
      color: #222;
      background-color: #fff;
    }

    .form-control:focus {
      outline: none;
      border-color: #1d5bbf;
      box-shadow: 0 0 0 2px rgba(29, 91, 191, 0.15);
    }

    .form-error {
      display: none;
      margin-top: 8px;
      margin-bottom: 12px;
      padding: 8px 12px;
      font-size: 13px;
      color: #b91c1c;
      background-color: #fef2f2;
      border: 1px solid #f87171;
      border-radius: 6px;
    }

    .form-error.visible {
      display: block;
    }

    .modal-actions {
      display: flex;
      justify-content: flex-end;
      gap: 10px;
      margin-top: 18px;
      padding-top: 14px;
      border-top: 1px solid #eef1f6;
    }

    .btn-cancel {
      padding: 8px 16px;
      font-size: 14px;
      font-weight: 600;
      color: #3b4859;
      background-color: #eef1f6;
      border: 1px solid #d0d7e2;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-cancel:hover {
      background-color: #e1e7f0;
    }

    .btn-submit {
      padding: 8px 18px;
      font-size: 14px;
      font-weight: 600;
      color: #ffffff;
      background-color: #1d5bbf;
      border: 1px solid #1d5bbf;
      border-radius: 6px;
      cursor: pointer;
    }

    .btn-submit:hover {
      background-color: #164694;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="header-bar">
      <h1>Мережа магазинів автозапчастин</h1>
    </div>
    
    <div class="top-controls">
      <div class="tabs-nav" id="tabs-nav" role="tablist"></div>
      <button type="button" class="add-btn" id="open-modal-btn">+ Додати</button>
    </div>

    <div id="tables-container"></div>
  </div>

  <!-- Попап з динамічною формою додавання -->
  <div class="modal-overlay" id="add-modal-overlay" role="dialog" aria-modal="true">
    <div class="modal-window">
      <div class="modal-header">
        <h2 class="modal-title" id="modal-title">Додати запис</h2>
        <button type="button" class="modal-close" id="close-modal-btn" aria-label="Закрити">&times;</button>
      </div>
      <div class="modal-body">
        <form id="entity-form" novalidate>
          <div id="form-fields-container"></div>
          <div class="form-error" id="form-error-msg">Будь ласка, заповніть усі поля форми.</div>
          <div class="modal-actions">
            <button type="button" class="btn-cancel" id="cancel-modal-btn">Скасувати</button>
            <button type="submit" class="btn-submit" id="submit-form-btn">Зберегти у таблицю</button>
          </div>
        </form>
      </div>
    </div>
  </div>

  <!-- Попап помилки видалення пов'язаних даних -->
  <div class="modal-overlay" id="error-modal-overlay" role="alertdialog" aria-modal="true">
    <div class="modal-window">
      <div class="modal-header error-header">
        <h2 class="modal-title" id="error-modal-title">Неможливо видалити запис</h2>
        <button type="button" class="modal-close" id="close-error-modal-btn" aria-label="Закрити">&times;</button>
      </div>
      <div class="modal-body">
        <p class="error-modal-text" id="error-modal-message"></p>
        <ul class="error-details-list" id="error-modal-list"></ul>
        <div class="modal-actions">
          <button type="button" class="btn-submit" id="ok-error-modal-btn">Зрозуміло</button>
        </div>
      </div>
    </div>
  </div>

  <script>

    let partsData = [

      {

      {

        model: "Varta Blue Dynamic D24 (Універсальний)",
        price: "3 400 грн",
        storeAddress: "м. Харків, просп. Науки, 48"
      }
    ];

    // Дані сутності «Співробітники»
    let employeesData = [
      {
        fullName: "Коваленко Олександр Петрович",
        position: "Продавець-консультант",
        hireDate: "15.03.2021",
        onVacation: "Ні",

      },
      {
        fullName: "Мельник Ірина Василівна",
        position: "Бухгалтер",
        hireDate: "02.08.2020",
        onVacation: "Так",
        storeAddress: "м. Київ, вул. Велика Васильківська, 114"
      },
      {
        fullName: "Шевченко Дмитро Сергійович",
        position: "Касир",
        hireDate: "10.01.2023",
        onVacation: "Ні",
        storeAddress: "м. Харків, просп. Науки, 48"
      },
      {
        fullName: "Бондаренко Тарас Миколайович",
        position: "Охоронець",
        hireDate: "24.05.2022",
        onVacation: "Ні",
        storeAddress: "м. Харків, просп. Науки, 48"
      },
      {
        fullName: "Савченко Наталія Ігорівна",
        position: "Продавець-консультант",
        hireDate: "19.11.2021",
        onVacation: "Так",
        storeAddress: "м. Львів, вул. Городоцька, 172"
      },
      {
        fullName: "Ткаченко Віктор Андрійович",
        position: "Касир",
        hireDate: "05.09.2023",
        onVacation: "Ні",
        storeAddress: "м. Дніпро, просп. Богдана Хмельницького, 31"
      }
    ];

    // Дані сутності «Магазини»
    let storesData = [
      {
        name: "АвтоДім Центральний",
        storeAddress: "м. Київ, вул. Велика Васильківська, 114",
        workingHours: "Пн–Сб: 08:30–20:00, Нд: 09:00–18:00",
        hasDelivery: "Так"
      },
      {
        name: "МоторМаркет Наукова",
        storeAddress: "м. Харків, просп. Науки, 48",
        workingHours: "Пн–Сб: 09:00–19:00, Нд: вихідний",
        hasDelivery: "Так"
      },
      {
        name: "ЗахідАвтоЗапчастини",
        storeAddress: "м. Львів, вул. Городоцька, 172",
        workingHours: "Пн–Пт: 09:00–19:30, Сб: 09:00–17:00",
        hasDelivery: "Ні"
      },
      {
        name: "ДніпроАвтоСклад",
        storeAddress: "м. Дніпро, просп. Богдана Хмельницького, 31",
        workingHours: "Пн–Сб: 08:00–19:00, Нд: 09:00–16:00",
        hasDelivery: "Так"
      }
    ];

    // Конфігурація сутностей, колонок таблиць і полів форми
    let entitiesConfig = [
      {
        id: "parts",
        title: "Запчастини",
        columns: [
          { key: "code", label: "Код товару", type: "text", placeholder: "Напр., AP-7015" },
          { key: "name", label: "Назва", type: "text", placeholder: "Напр., Диск гальмівний" },
          { key: "model", label: "Модель", type: "text", placeholder: "Напр., Brembo 09.9772.11" },
          { key: "price", label: "Ціна", type: "text", placeholder: "Напр., 2 150 грн" },
          { key: "storeAddress", label: "Адреса магазина", type: "text", placeholder: "Напр., м. Київ, вул. Велика Васильківська, 114" }
        ],
        data: partsData
      },
      {
        id: "employees",
        title: "Співробітники",
        columns: [
          { key: "fullName", label: "ПІБ", type: "text", placeholder: "Прізвище Ім'я По батькові" },
          { key: "position", label: "Посада", type: "text", placeholder: "Напр., Продавець, Бухгалтер, Касир, Охоронець" },
          { key: "hireDate", label: "Дата найму", type: "text", placeholder: "ДД.ММ.РРРР (напр., 12.04.2024)" },
          { key: "onVacation", label: "Відпустка", type: "select", options: ["Ні", "Так"] },
          { key: "storeAddress", label: "Адреса магазина", type: "text", placeholder: "Напр., м. Харків, просп. Науки, 48" }
        ],
        data: employeesData
      },
      {
        id: "stores",
        title: "Магазини",
        columns: [
          { key: "name", label: "Назва", type: "text", placeholder: "Напр., АвтоМастер Схід" },
          { key: "storeAddress", label: "Адреса магазина", type: "text", placeholder: "Напр., м. Одеса, вул. Приморська, 22" },
          { key: "workingHours", label: "Час роботи", type: "text", placeholder: "Напр., Пн–Сб: 09:00–19:00" },
          { key: "hasDelivery", label: "Наявність доставки", type: "select", options: ["Так", "Ні"] }
        ],
        data: storesData
      }
    ];

    // Змінна для відстеження поточного активного таба
    let activeEntityId = entitiesConfig[0].id;

    // Допоміжна функція пошуку конфігурації сутності за її id
    function getEntityById(entityId) {
      for (let i = 0; i < entitiesConfig.length; i++) {
        if (entitiesConfig[i].id === entityId) {
          return entitiesConfig[i];
        }
      }
      return null;
    }

    // Відображення вмісту комірки у звичайному режимі (перегляду)
    function renderCellContent(td, colKey, cellValue) {
      td.innerHTML = "";
      td.className = "editable-cell";

      if (colKey === "onVacation" || colKey === "hasDelivery") {
        let badge = document.createElement("span");
        let isYes = cellValue === "Так";
        badge.className = isYes ? "badge badge-yes" : "badge badge-no";
        badge.textContent = cellValue;
        td.appendChild(badge);
      } else if (colKey === "price") {
        td.classList.add("price-cell");
        td.textContent = cellValue;
      } else {
        td.textContent = cellValue;
      }
    }

    // Переведення комірки таблиці у режим редагування по кліку
    function startCellEdit(td, entity, item, column) {
      if (td.classList.contains("editing")) {
        return;
      }

      let colKey = column.key;
      let originalValue = item[colKey];
      td.classList.add("editing");
      td.innerHTML = "";

      let wrapper = document.createElement("div");
      wrapper.className = "inline-edit-wrapper";

      let inputEl = null;

      if (column.type === "select" && column.options) {
        inputEl = document.createElement("select");
        inputEl.className = "inline-input";
        for (let i = 0; i < column.options.length; i++) {
          let opt = document.createElement("option");
          opt.value = column.options[i];
          opt.textContent = column.options[i];
          if (column.options[i] === originalValue) {
            opt.selected = true;
          }
          inputEl.appendChild(opt);
        }
      } else {
        inputEl = document.createElement("input");
        inputEl.type = "text";
        inputEl.className = "inline-input";
        inputEl.value = originalValue;
      }

      let saveBtn = document.createElement("button");
      saveBtn.type = "button";
      saveBtn.className = "inline-save-btn";
      saveBtn.textContent = "✓";
      saveBtn.title = "Зберегти";

      let isFinished = false;

      function finishEdit(shouldSave) {
        if (isFinished) {
          return;
        }
        isFinished = true;

        let newValue = inputEl.value.trim();
        if (!shouldSave || newValue === "") {
          newValue = originalValue;
        } else if (colKey === "price" && newValue.indexOf("грн") === -1) {
          newValue = newValue + " грн";
        }

        // Якщо змінюється адреса магазина у таблиці «Магазини», синхронізуємо пов'язані записи
        if (shouldSave && entity.id === "stores" && colKey === "storeAddress" && newValue !== originalValue) {
          for (let p = 0; p < partsData.length; p++) {
            if (partsData[p].storeAddress === originalValue) {
              partsData[p].storeAddress = newValue;
            }
          }
          for (let e = 0; e < employeesData.length; e++) {
            if (employeesData[e].storeAddress === originalValue) {
              employeesData[e].storeAddress = newValue;
            }
          }
          item[colKey] = newValue;
          refreshEntityTable("parts");
          refreshEntityTable("employees");
          renderCellContent(td, colKey, newValue);
          return;
        }

        item[colKey] = newValue;
        renderCellContent(td, colKey, newValue);
      }

      // Запобігаємо повторному спрацюванню кліку на самій комірці
      wrapper.addEventListener("click", function (event) {
        event.stopPropagation();
      });

      // Натискання кнопки збереження
      saveBtn.addEventListener("mousedown", function (event) {
        event.preventDefault();
        finishEdit(true);
      });

      // Натискання Enter або Escape у полі вводу
      inputEl.addEventListener("keydown", function (event) {
        if (event.key === "Enter") {
          event.preventDefault();
          finishEdit(true);
        } else if (event.key === "Escape") {
          event.preventDefault();
          finishEdit(false);
        }
      });

      // Для select зручно зберігати також одразу при зміні значення
      if (column.type === "select") {
        inputEl.addEventListener("change", function () {
          finishEdit(true);
        });
      }

      // Збереження при кліку в будь-якій іншій частині документа (втрата фокусу)
      inputEl.addEventListener("blur", function () {
        finishEdit(true);
      });

      wrapper.appendChild(inputEl);
      wrapper.appendChild(saveBtn);
      td.appendChild(wrapper);

      inputEl.focus();
      if (inputEl.select) {
        inputEl.select();
      }
    }

    // Перевірка, чи прив'язаний рядок до інших таблиць перед видаленням
    function checkRowDependencies(entityId, item) {
      let reasons = [];

      if (entityId === "stores") {
        let targetAddress = item.storeAddress.trim();
        let linkedEmployees = [];
        let linkedParts = [];

        for (let i = 0; i < employeesData.length; i++) {
          if (employeesData[i].storeAddress.trim() === targetAddress) {
            linkedEmployees.push(employeesData[i].fullName + " (" + employeesData[i].position + ")");
          }
        }

        for (let j = 0; j < partsData.length; j++) {
          if (partsData[j].storeAddress.trim() === targetAddress) {
            linkedParts.push(partsData[j].name + " [" + partsData[j].code + "]");
          }
        }

        if (linkedEmployees.length > 0) {
          reasons.push(
            "Таблиця «Співробітники» — працюють у цьому магазині (" +
              linkedEmployees.length +
              " ос.): " +
              linkedEmployees.join(", ")
          );
        }

        if (linkedParts.length > 0) {
          reasons.push(
            "Таблиця «Запчастини» — обліковуються за цією адресою (" +
              linkedParts.length +
              " шт.): " +
              linkedParts.join(", ")
          );
        }
      }

      return reasons;
    }

    // Відкриття попапу з помилкою видалення
    function openErrorModal(itemTitle, reasons) {
      let overlay = document.getElementById("error-modal-overlay");
      let messageEl = document.getElementById("error-modal-message");
      let listEl = document.getElementById("error-modal-list");

      messageEl.textContent =
        "Запис «" +
        itemTitle +
        "» неможливо видалити, оскільки його дані зараз використовуються в інших таблицях:";

      listEl.innerHTML = "";
      for (let i = 0; i < reasons.length; i++) {
        let li = document.createElement("li");
        li.textContent = reasons[i];
        listEl.appendChild(li);
      }

      overlay.classList.add("open");
    }

    // Закриття попапу з помилкою видалення
    function closeErrorModal() {
      let overlay = document.getElementById("error-modal-overlay");
      overlay.classList.remove("open");
    }

    // Оновити лічильник записів на кнопці таба
    function updateTabCounter(entity) {
      let tabButtons = document.querySelectorAll(".tab-btn");
      for (let i = 0; i < tabButtons.length; i++) {
        let btn = tabButtons[i];
        if (btn.getAttribute("data-tab") === entity.id) {
          btn.textContent = entity.title + " (" + entity.data.length + ")";
        }
      }
    }

    // Перемальовування tbody конкретної таблиці
    function refreshEntityTable(entityId) {
      let entity = getEntityById(entityId);
      let tbody = document.getElementById("tbody-" + entityId);
      if (!entity || !tbody) {
        return;
      }

      tbody.innerHTML = "";
      for (let i = 0; i < entity.data.length; i++) {
        let tr = createTableRow(entity, entity.data[i]);
        tbody.appendChild(tr);
      }
      updateTabCounter(entity);
    }

    // Видалення рядка з таблиці (або показ помилки, якщо є зв'язки)
    function handleDeleteRow(entity, item) {
      let dependencies = checkRowDependencies(entity.id, item);

      if (dependencies.length > 0) {
        let recordName = item.name || item.fullName || item.code || item.storeAddress;
        openErrorModal(recordName, dependencies);
        return;
      }

      let index = entity.data.indexOf(item);
      if (index !== -1) {
        entity.data.splice(index, 1);
        refreshEntityTable(entity.id);
      }
    }

    // Створення одного рядка таблиці (tr) для запису сутності
    function createTableRow(entity, item) {
      let tr = document.createElement("tr");

      for (let colIndex = 0; colIndex < entity.columns.length; colIndex++) {
        let column = entity.columns[colIndex];
        let colKey = column.key;
        let cellValue = item[colKey];
        let td = document.createElement("td");

        renderCellContent(td, colKey, cellValue);
        td.title = "Натисніть, щоб змінити значення";

        td.addEventListener("click", function () {
          startCellEdit(td, entity, item, column);
        });

        tr.appendChild(td);
      }

      // Додаткова колонка справа з кнопкою-хрестиком для видалення рядка
      let actionTd = document.createElement("td");
      actionTd.className = "action-cell";

      let deleteBtn = document.createElement("button");
      deleteBtn.type = "button";
      deleteBtn.className = "delete-row-btn";
      deleteBtn.innerHTML = "&times;";
      deleteBtn.title = "Видалити рядок";
      deleteBtn.setAttribute("aria-label", "Видалити рядок");

      deleteBtn.addEventListener("click", function (event) {
        event.stopPropagation();
        handleDeleteRow(entity, item);
      });

      actionTd.appendChild(deleteBtn);
      tr.appendChild(actionTd);

      return tr;
    }

    // Функція створення HTML-таблиці для конкретної сутності
    function createEntityTable(entity) {
      let tableWrapper = document.createElement("div");
      tableWrapper.className = "table-wrapper";

      let table = document.createElement("table");
      table.id = "table-" + entity.id;

      // Створення заголовка таблиці (thead)
      let thead = document.createElement("thead");
      let headerRow = document.createElement("tr");

      for (let i = 0; i < entity.columns.length; i++) {
        let col = entity.columns[i];
        let th = document.createElement("th");
        th.textContent = col.label;
        headerRow.appendChild(th);
      }

      let actionTh = document.createElement("th");
      actionTh.className = "action-col";
      actionTh.textContent = "Дія";
      headerRow.appendChild(actionTh);

      thead.appendChild(headerRow);
      table.appendChild(thead);

      // Створення тіла таблиці (tbody)
      let tbody = document.createElement("tbody");
      tbody.id = "tbody-" + entity.id;

      for (let rowIndex = 0; rowIndex < entity.data.length; rowIndex++) {
        let item = entity.data[rowIndex];
        let tr = createTableRow(entity, item);
        tbody.appendChild(tr);
      }

      table.appendChild(tbody);
      tableWrapper.appendChild(table);

      return tableWrapper;
    }

    // Оновлення тексту кнопки відкриття форми відповідно до активного таба
    function updateAddButtonLabel() {
      let entity = getEntityById(activeEntityId);
      let openModalBtn = document.getElementById("open-modal-btn");
      if (entity && openModalBtn) {
        openModalBtn.textContent = "+ Додати (" + entity.title + ")";
      }
    }

    // Функція перемикання активного таба
    function activateTab(targetId) {
      activeEntityId = targetId;
      let tabButtons = document.querySelectorAll(".tab-btn");
      let tabPanels = document.querySelectorAll(".tab-panel");

      for (let i = 0; i < tabButtons.length; i++) {
        let btn = tabButtons[i];
        let isCurrent = btn.getAttribute("data-tab") === targetId;
        btn.classList.toggle("active", isCurrent);
        btn.setAttribute("aria-selected", isCurrent ? "true" : "false");
      }

      for (let j = 0; j < tabPanels.length; j++) {
        let panel = tabPanels[j];
        let isCurrentPanel = panel.id === "panel-" + targetId;
        panel.classList.toggle("active", isCurrentPanel);
      }

      updateAddButtonLabel();
    }

    // Генерація полів форми у попапі згідно зі структурою активної сутності
    function renderModalFormFields(entity) {
      let fieldsContainer = document.getElementById("form-fields-container");
      let modalTitle = document.getElementById("modal-title");
      let errorMsg = document.getElementById("form-error-msg");

      fieldsContainer.innerHTML = "";
      errorMsg.classList.remove("visible");
      modalTitle.textContent = "Додати запис: «" + entity.title + "»";

      for (let i = 0; i < entity.columns.length; i++) {
        let col = entity.columns[i];
        let group = document.createElement("div");
        group.className = "form-group";

        let fieldId = "field-" + entity.id + "-" + col.key;
        let label = document.createElement("label");
        label.setAttribute("for", fieldId);
        label.textContent = col.label;
        group.appendChild(label);

        let inputElement = null;

        if (col.type === "select" && col.options) {
          inputElement = document.createElement("select");
          inputElement.className = "form-control";
          inputElement.id = fieldId;
          inputElement.name = col.key;

          for (let optIdx = 0; optIdx < col.options.length; optIdx++) {
            let option = document.createElement("option");
            option.value = col.options[optIdx];
            option.textContent = col.options[optIdx];
            inputElement.appendChild(option);
          }
        } else {
          inputElement = document.createElement("input");
          inputElement.type = "text";
          inputElement.className = "form-control";
          inputElement.id = fieldId;
          inputElement.name = col.key;
          inputElement.placeholder = col.placeholder || "";
        }

        group.appendChild(inputElement);
        fieldsContainer.appendChild(group);
      }
    }

    // Відкриття попапу з формою
    function openAddModal() {
      let entity = getEntityById(activeEntityId);
      if (!entity) {
        return;
      }

      renderModalFormFields(entity);

      let overlay = document.getElementById("add-modal-overlay");
      overlay.classList.add("open");

      let firstInput = overlay.querySelector(".form-control");
      if (firstInput) {
        firstInput.focus();
      }
    }

    // Закриття попапу з формою
    function closeAddModal() {
      let overlay = document.getElementById("add-modal-overlay");
      overlay.classList.remove("open");
    }

    // Обробка відправки форми та додавання нового рядка у таблицю
    function handleFormSubmit(event) {
      event.preventDefault();

      let entity = getEntityById(activeEntityId);
      if (!entity) {
        return;
      }

      let newRecord = {};
      let isFormValid = true;

      for (let i = 0; i < entity.columns.length; i++) {
        let col = entity.columns[i];
        let fieldId = "field-" + entity.id + "-" + col.key;
        let fieldElement = document.getElementById(fieldId);
        let value = fieldElement ? fieldElement.value.trim() : "";

        if (value === "") {
          isFormValid = false;
        }

        if (col.key === "price" && value !== "" && value.indexOf("грн") === -1) {
          value = value + " грн";
        }

        newRecord[col.key] = value;
      }

      let errorMsg = document.getElementById("form-error-msg");
      if (!isFormValid) {
        errorMsg.classList.add("visible");
        return;
      }

      errorMsg.classList.remove("visible");

      // Додаємо новий об'єкт у масив даних сутності
      entity.data.push(newRecord);

      // Додаємо новий рядок у відповідну таблицю в DOM
      let tbody = document.getElementById("tbody-" + entity.id);
      if (tbody) {
        let newRow = createTableRow(entity, newRecord);
        tbody.appendChild(newRow);
      }

      // Оновлюємо лічильник записів на кнопці таба
      updateTabCounter(entity);

      closeAddModal();
    }

    // Ініціалізація та рендеринг усіх табів і таблиць на сторінці
    function initApp() {
      let tabsNav = document.getElementById("tabs-nav");
      let tablesContainer = document.getElementById("tables-container");

      for (let i = 0; i < entitiesConfig.length; i++) {
        let entity = entitiesConfig[i];
        let isFirst = i === 0;

        // Створення кнопки таба
        let tabButton = document.createElement("button");
        tabButton.type = "button";
        tabButton.className = isFirst ? "tab-btn active" : "tab-btn";
        tabButton.setAttribute("data-tab", entity.id);
        tabButton.setAttribute("role", "tab");
        tabButton.setAttribute("aria-selected", isFirst ? "true" : "false");
        tabButton.textContent = entity.title + " (" + entity.data.length + ")";

        tabButton.addEventListener("click", function () {
          let selectedTabId = this.getAttribute("data-tab");
          activateTab(selectedTabId);
        });

        tabsNav.appendChild(tabButton);

        // Створення панелі з таблицею
        let panel = document.createElement("div");
        panel.id = "panel-" + entity.id;
        panel.className = isFirst ? "tab-panel active" : "tab-panel";
        panel.setAttribute("role", "tabpanel");

        let renderedTable = createEntityTable(entity);
        panel.appendChild(renderedTable);

        tablesContainer.appendChild(panel);
      }

      updateAddButtonLabel();

      // Прив'язка обробників подій для модального вікна додавання
      let openModalBtn = document.getElementById("open-modal-btn");
      let closeModalBtn = document.getElementById("close-modal-btn");
      let cancelModalBtn = document.getElementById("cancel-modal-btn");
      let modalOverlay = document.getElementById("add-modal-overlay");
      let entityForm = document.getElementById("entity-form");

      openModalBtn.addEventListener("click", openAddModal);
      closeModalBtn.addEventListener("click", closeAddModal);
      cancelModalBtn.addEventListener("click", closeAddModal);

      modalOverlay.addEventListener("click", function (event) {
        if (event.target === modalOverlay) {
          closeAddModal();
        }
      });

      entityForm.addEventListener("submit", handleFormSubmit);

      // Прив'язка обробників подій для модального вікна помилки видалення
      let errorOverlay = document.getElementById("error-modal-overlay");
      let closeErrorBtn = document.getElementById("close-error-modal-btn");
      let okErrorBtn = document.getElementById("ok-error-modal-btn");

      closeErrorBtn.addEventListener("click", closeErrorModal);
      okErrorBtn.addEventListener("click", closeErrorModal);

      errorOverlay.addEventListener("click", function (event) {
        if (event.target === errorOverlay) {
          closeErrorModal();
        }
      });
    }

    document.addEventListener("DOMContentLoaded", initApp);
  </script>
</body>
